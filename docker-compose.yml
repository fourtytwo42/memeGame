services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: meme_foundry
      POSTGRES_USER: meme
      POSTGRES_PASSWORD: meme
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meme -d meme_foundry"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    networks:
      - meme-foundry

  redis:
    image: redis:8-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:56379:6379"
    networks:
      - meme-foundry

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://meme:meme@postgres:5432/meme_foundry
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: meme:docker
      REALTIME_URL: http://realtime:3001
      AI_SERVICE_URL: http://ai-service:3002
      NEXT_PUBLIC_REALTIME_URL: http://localhost:8080
    command:
      [
        "bash",
        "-lc",
        "pnpm db:deploy && pnpm db:seed && pnpm --dir apps/web exec next start -H 0.0.0.0 -p 3000"
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      realtime:
        condition: service_started
      ai-service:
        condition: service_started
    volumes:
      - generated-assets:/app/apps/web/public/generated
      - image-data:/app/data/images
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - meme-foundry

  realtime:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://meme:meme@postgres:5432/meme_foundry
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: meme:docker
      WEB_ORIGIN: http://localhost:8080,http://127.0.0.1:8080
      REALTIME_HOST: 0.0.0.0
      REALTIME_PORT: 3001
    command: ["pnpm", "--filter", "@meme-foundry/realtime-app", "start"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3001/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - meme-foundry

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://meme:meme@postgres:5432/meme_foundry
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 3002
      AI_TEXT_ENABLED: "false"
      LOCAL_LLM_BASE_URL: http://host.docker.internal:11434/v1
    command: ["pnpm", "--filter", "@meme-foundry/ai-service", "start"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3002/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - meme-foundry

  worker-ai-text:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://meme:meme@postgres:5432/meme_foundry
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: meme:docker
      AI_SERVICE_URL: http://ai-service:3002
    command: ["pnpm", "--filter", "@meme-foundry/worker-ai-text", "start"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - meme-foundry

  worker-image:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://meme:meme@postgres:5432/meme_foundry
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: meme:docker
      IMAGE_STORAGE_ROOT: /app
      IMAGE_PUBLIC_ROOT: /app/apps/web/public/generated
      IMAGE_MIN_FREE_BYTES: "50000000"
    command: ["pnpm", "--filter", "@meme-foundry/worker-image", "start"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      realtime:
        condition: service_started
    volumes:
      - generated-assets:/app/apps/web/public/generated
      - image-data:/app/data/images
    networks:
      - meme-foundry

  nginx:
    image: nginx:1.29-bookworm
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/meme-foundry.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
      realtime:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
    networks:
      - meme-foundry

volumes:
  postgres-data:
  redis-data:
  generated-assets:
  image-data:

networks:
  meme-foundry:
    driver: bridge
